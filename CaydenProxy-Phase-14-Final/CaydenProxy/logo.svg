<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" role="img" aria-labelledby="title desc"><title id="title">CaydenProxy logo</title><desc id="desc">A five-petal flower with a browser-arrow center, beside the CaydenProxy wordmark and Bloom While You Browse tagline. CaydenProxy project credit: Cayden Flowers.</desc><g transform="translate(7 0)" stroke="#fff8e9" stroke-width="3"><ellipse cx="67" cy="37" rx="19" ry="27" fill="#ffd54f"/><ellipse cx="101" cy="62" rx="19" ry="27" transform="rotate(72 101 62)" fill="#6bbf59"/><ellipse cx="88" cy="101" rx="19" ry="27" transform="rotate(144 88 101)" fill="#ff7184"/><ellipse cx="46" cy="101" rx="19" ry="27" transform="rotate(216 46 101)" fill="#56c1ef"/><ellipse cx="33" cy="62" rx="19" ry="27" transform="rotate(288 33 62)" fill="#ff7184"/><circle cx="67" cy="72" r="25" fill="#6b4f3b"/></g><path d="M54 83 81 56M62 56h19v18" fill="none" stroke="#fff8e9" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/><text x="145" y="72" font-family="Trebuchet MS,system-ui,sans-serif" font-size="51" font-weight="900" letter-spacing="-2" fill="#6b4f3b">Cayden</text><text x="325" y="72" font-family="Trebuchet MS,system-ui,sans-serif" font-size="51" font-weight="900" letter-spacing="-2"><tspan fill="#ffd54f">P</tspan><tspan fill="#ff7184">r</tspan><tspan fill="#6bbf59">o</tspan><tspan fill="#56c1ef">x</tspan><tspan fill="#ff7184">y</tspan></text><text x="148" y="110" font-family="Trebuchet MS,system-ui,sans-serif" font-size="18" letter-spacing="1.2" fill="#6b4f3b">Bloom While You Browse</text><text x="148" y="132" font-family="Trebuchet MS,system-ui,sans-serif" font-size="12" letter-spacing="2.5" fill="#9a7b5e">SEARCH. PLAY. FLOURISH.</text></svg>
