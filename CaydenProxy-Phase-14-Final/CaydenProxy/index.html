e-columns:minmax(0,1fr) minmax(250px,.65fr);gap:16px}.focus-clock{font-size:clamp(3.8rem,10vw,6.5rem);font-weight:950;letter-spacing:-.06em;line-height:1.1;text-align:center;font-variant-numeric:tabular-nums;padding:25px 0}.focus-presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}.focus-preset[aria-pressed="true"]{background:var(--yellow);color:#493628;border-color:var(--accent)}.focus-rail{height:12px;background:var(--line);border-radius:999px;overflow:hidden}.focus-rail span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:inherit}.focus-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}.field-input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}.music-tweaks{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}.music-tweaks label{display:flex;gap:7px;align-items:center;flex:1;min-width:155px;font-size:.82rem;color:var(--muted)}.music-tweaks input{width:100%;min-width:60px;accent-color:var(--accent)}.music-tweaks select{max-width:150px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}.new-stuff-tag{display:inline-flex;padding:4px 8px;border-radius:999px;background:color-mix(in srgb,var(--blue) 20%,var(--panel));font-size:.72rem;font-weight:900;color:var(--ink)}

<script>
(() => {
'use strict';
const $ = (s,root=document) => root.querySelector(s);
const $$ = (s,root=document) => [...root.querySelectorAll(s)];
const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const main = $('#main');
let navStack=[{route:'home',data:null}], navIndex=0, activeGame=null, gameState=null, currentFilter='All', gameQuery='';
let gameTimer=null,focusInterval=null,focusSeconds=15*60,focusDuration=15*60,focusMode="focus",focusRunning=false;
let currentTheme=sessionStorage.getItem('cp-theme') || 'day';
let currentBackground=sessionStorage.getItem('cp-bg') || '';
let highContrast=sessionStorage.getItem('cp-contrast') === 'true';
const safeLocalGet=(key,fallback)=>{try{return localStorage.getItem(key)||fallback}catch(_){return fallback}};
const safeLocalSet=(key,value)=>{try{localStorage.setItem(key,String(value))}catch(_){/* browser privacy settings may block storage */}};
const defaultGardenProfile=()=>({xp:0,gamesPlayed:0,uniqueGames:[],recent:[],favorites:[],playCounts:{},bestScores:{},lastPlayedAt:{},gameProgress:{},totalCorrect:0,totalNotes:0,focusSessions:0,streak:0,lastCheckin:'',daily:{date:'',played:false,correct:0,notes:0,journal:false,focus:false,checkin:false,claimed:[]}});
function loadGardenProfile(){try{const loaded=JSON.parse(localStorage.getItem('cp-garden-profile')||'{}');const profile={...defaultGardenProfile(),...loaded,daily:{...defaultGardenProfile().daily,...(loaded.daily||{})}};for(const key of ['playCounts','bestScores','lastPlayedAt','gameProgress'])if(!profile[key]||typeof profile[key]!=='object'||Array.isArray(profile[key]))profile[key]={};for(const [id,entry] of Object.entries(profile.gameProgress)){if(!entry||typeof entry!=='object'||Array.isArray(entry)){delete profile.gameProgress[id];continue;}profile.gameProgress[id]={completedSessions:Math.max(0,Math.floor(Number(entry.completedSessions)||0)),lastScore:Math.max(0,Math.floor(Number(entry.lastScore)||0)),bestScore:Math.max(0,Math.floor(Number(entry.bestScore)||0)),lastCompletionPct:Number.isFinite(Number(entry.lastCompletionPct))&&entry.lastCompletionPct!==null?Math.max(0,Math.min(100,Math.floor(Number(entry.lastCompletionPct)))):null,bestCompletionPct:Number.isFinite(Number(entry.bestCompletionPct))&&entry.bestCompletionPct!==null?Math.max(0,Math.min(100,Math.floor(Number(entry.bestCompletionPct)))):null,lastCompletedAt:Math.max(0,Number(entry.lastCompletedAt)||0),perfectClears:Math.max(0,Math.floor(Number(entry.perfectClears)||0))};}return profile}catch(_){return defaultGardenProfile()}}
let gardenProfile=loadGardenProfile();
function saveGardenProfile(){safeLocalSet('cp-garden-profile',JSON.stringify(gardenProfile));updateGardenStatus()}
function localDayKey(date=new Date()){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
function ensureDailyProfile(){const today=localDayKey();if(gardenProfile.daily.date!==today){gardenProfile.daily={date:today,played:false,correct:0,notes:0,journal:false,focus:false,checkin:false,claimed:[]};saveGardenProfile()}if(!Array.isArray(gardenProfile.daily.claimed))gardenProfile.daily.claimed=[]}
function gardenLevel(){return Math.floor(gardenProfile.xp/100)+1}
function updateGardenStatus(){const label=$('#gardenStatusText');if(label)label.textContent=`Level ${gardenLevel()} · ${gardenProfile.xp} petals`}
function awardXP(amount,reason='A little progress'){const oldLevel=gardenLevel();gardenProfile.xp=Math.max(0,gardenProfile.xp+Math.max(0,Math.round(amount)));saveGardenProfile();if(gardenLevel()>oldLevel)showToast(`LEVEL UP! 🌻 You reached garden level ${gardenLevel()}.`)}
function dailyQuests(){ensureDailyProfile();const d=gardenProfile.daily;return [
 {id:'play',icon:'🎮',title:'Take a play break',desc:'Open any game in the Learning Arcade.',done:d.played,progress:d.played?'1 / 1':'0 / 1',route:'games'},
 {id:'quiz',icon:'🌼',title:'Collect five petals',desc:'Answer 5 quiz questions correctly.',done:d.correct>=5,progress:`${Math.min(d.correct,5)} / 5`,route:'games'},

function evaluateDailyQuests(){ensureDailyProfile();const d=gardenProfile.daily;let changed=false;for(const q of dailyQuests()){if(q.done&&!d.claimed.includes(q.id)){d.claimed.push(q.id);gardenProfile.xp+=10;changed=true;showToast(`Daily quest complete: ${q.title} +10 petals 🌱`)}}if(changed)saveGardenProfile()}
function registerCorrectAnswer(){ensureDailyProfile();gardenProfile.totalCorrect++;gardenProfile.daily.correct++;awardXP(2);evaluateDailyQuests()}
function registerInstrumentNote(){ensureDailyProfile();gardenProfile.totalNotes++;gardenProfile.daily.notes++;saveGardenProfile();evaluateDailyQuests()}
function saveGameBest(id,score){const value=Math.max(0,Math.floor(Number(score)||0));if(!id||value<=(Number(gardenProfile.bestScores[id])||0))return;gardenProfile.bestScores[id]=value;saveGardenProfile()}
function recordGameCompletion(id,score,total=null){if(!id)return null;if(!gardenProfile.gameProgress||typeof gardenProfile.gameProgress!=='object')gardenProfile.gameProgress={};const old=gardenProfile.gameProgress[id]||{};const safeScore=Math.max(0,Math.floor(Number(score)||0));const safeTotal=Number(total);const pct=Number.isFinite(safeTotal)&&safeTotal>0?Math.max(0,Math.min(100,Math.round(safeScore/safeTotal*100))):null;const bestPct=pct===null?(old.bestCompletionPct??null):Math.max(Number(old.bestCompletionPct)||0,pct);const next={completedSessions:Math.max(0,Number(old.completedSessions)||0)+1,lastScore:safeScore,bestScore:Math.max(Number(old.bestScore)||0,safeScore),lastCompletionPct:pct,bestCompletionPct:bestPct,lastCompletedAt:Date.now(),perfectClears:Math.max(0,Number(old.perfectClears)||0)+(pct===100?1:0)};gardenProfile.gameProgress[id]=next;saveGameBest(id,safeScore);saveGardenProfile();if(pct===100)showToast('PERFECT CLEAR! 🌟 A full-mark challenge was saved to your Passport.');else showToast('Challenge cleared! 🏁 Your game progress was saved.');return next}
function completedGameCount(){return Object.values(gardenProfile.gameProgress||{}).filter(entry=>entry&&Number(entry.completedSessions)>0).length}
function markGameStarted(id){ensureDailyProfile();gardenProfile.gamesPlayed++;gardenProfile.playCounts[id]=(Number(gardenProfile.playCounts[id])||0)+1;gardenProfile.lastPlayedAt[id]=Date.now();if(!gardenProfile.uniqueGames.includes(id))gardenProfile.uniqueGames.push(id);gardenProfile.recent=[id,...gardenProfile.recent.filter(x=>x!==id)].slice(0,8);gardenProfile.daily.played=true;saveGardenProfile();evaluateDailyQuests()}
function toggleFavorite(id){const legacyData=window.CaydenArcade?.data;const legacyFavorites=Array.isArray(legacyData?.favorites)?legacyData.favorites:[];const currentlyFavorite=gardenProfile.favorites.includes(id)||legacyFavorites.includes(id);if(currentlyFavorite){gardenProfile.favorites=gardenProfile.favorites.filter(x=>x!==id);if(legacyData)legacyData.favorites=legacyFavorites.filter(x=>x!==id);showToast('Removed from your favorite games.')}else{if(!gardenProfile.favorites.includes(id))gardenProfile.favorites.push(id);if(legacyData&&!legacyFavorites.includes(id))legacyData.favorites=[...legacyFavorites,id];showToast('Saved to your favorite games ⭐')}saveGardenProfile();if(legacyData&&typeof window.CaydenArcade?.persist==='function')window.CaydenArcade.persist();renderRoute()}
function checkInGarden(){ensureDailyProfile();if(gardenProfile.daily.checkin){showToast('You already checked in today. Come back tomorrow!');return}const today=localDayKey(),yesterdayDate=new Date();yesterdayDate.setDate(yesterdayDate.getDate()-1);const yesterday=localDayKey(yesterdayDate);if(gardenProfile.lastCheckin===yesterday)gardenProfile.streak++;else if(gardenProfile.lastCheckin!==today)gardenProfile.streak=1;gardenProfile.lastCheckin=today;gardenProfile.daily.checkin=true;awardXP(10);saveGardenProfile();showToast(`Garden check-in complete! +10 petals · ${gardenProfile.streak}-day streak 🌻`);renderRoute()}

function toolsPage(){return `<section class="page"><div class="page-head"><div><div class="eyebrow"><span class="seed"></span> Handy tools</div><h1>Small tools, big ideas.</h1><p>A simple scientific calculator, a unit converter, and a linear graph plotter — all running locally in your browser.</p></div><div class="emoji" aria-hidden="true">🧮</div></div><div class="tool-grid"><section class="tool-panel" aria-labelledby="calcHead"><h2 id="calcHead">Scientific calculator</h2><p>Try arithmetic, parentheses, powers, square roots, and trig functions in radians.</p><label class="sr-only" for="calcDisplay">Calculator expression and result</label><input id="calcDisplay" class="calc-display" value="" placeholder="0" autocomplete="off" aria-describedby="calcHelp"><p id="calcHelp" class="sr-only">Type an expression or use the calculator buttons. Supported functions: sin, cos, tan, sqrt, log, abs, pi and e.</p><div class="calc-grid" id="calcKeys">${['AC','DEL','(',')','÷','7','8','9','×','√','4','5','6','−','x²','1','2','3','+','sin','0','.','π','cos','='].map(k=>`<button class="calc-key ${['÷','×','−','+','sin','cos','√','x²','π'].includes(k)?'op':''} ${k==='='?'equals':''}" data-key="${k}" type="button">${k}</button>`).join('')}</div><div class="result-note" id="calcResult" role="status">Your result will appear here.</div></section><section class="tool-panel" aria-labelledby="convertHead"><h2 id="convertHead">Unit converter</h2><p>Convert common length, mass, and temperature units.</p><form id="convertForm" class="tool-form"><div class="field"><label for="convertCategory">Category</label><select id="convertCategory"><option value="length">Length</option><option value="mass">Mass</option><option value="temperature">Temperature</option></select></div><div class="inline-fields"><div class="field"><label for="convertValue">Value</label><input id="convertValue" type="number" value="1" step="any"></div><div class="field"><label for="convertFrom">From</label><select id="convertFrom"></select></div></div><div class="field"><label for="convertTo">To</label><select id="convertTo"></select></div><button class="btn btn-green" type="submit">Convert units ↗</button></form><div class="result-note" id="convertResult" role="status">1 meter = 100 centimeters</div></section><section class="tool-panel" aria-labelledby="graphHead"><h2 id="graphHead">Linear graph plotter</h2><p>Plot <strong>y = mx + b</strong>. Change the slope and intercept and the graph updates.</p><form id="graphForm" class="tool-form"><div class="inline-fields"><div class="field"><label for="slopeInput">Slope (m)</label><input id="slopeInput" type="number" value="1" step="any"></div><div class="field"><label for="interceptInput">Intercept (b)</label><input id="interceptInput" type="number" value="0" step="any"></div></div><button class="btn btn-secondary" type="submit">Plot line</button></form><canvas class="graph-canvas" id="graphCanvas" width="700" height="320" aria-label="Graph of the selected linear equation" role="img"></canvas><div class="result-note" id="graphResult" role="status">y = x</div></section><section class="tool-panel" aria-labelledby="toolsNote"><h2 id="toolsNote">A little toolkit note</h2><p>These tools are built into the page. Calculator expressions are parsed without evaluating arbitrary JavaScript.</p><div class="notice"><strong>Quick math tip 🌱</strong><br>On a line written as <strong>y = mx + b</strong>, <em>m</em> tells you how steep the line is, while <em>b</em> is where it crosses the vertical axis.</div><div style="margin-top:14px"><button class="btn btn-secondary" data-route="games">Back to learning games</button></div></section></div></section>`}

function settingsPage(){const floralThemes=window.CaydenFloralThemes?.themes||[];const activeFloral=window.CaydenFloralThemes?.currentId||'daisy-cream';return `<section class="page"><div class="page-head"><div><div class="eyebrow"><span class="seed"></span> Your garden, your way</div><h1>Personalize your space.</h1><p>Flower palettes save on this device. Custom background and lighting controls are available too.</p></div><div class="emoji" aria-hidden="true">🎨</div></div><div class="settings-grid"><section class="settings-panel"><h2>Garden theme</h2><p>Choose a bright daytime garden or a soft twilight palette.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-secondary" data-theme="day" aria-pressed="${currentTheme==='day'}">☀️ Day Garden</button><button class="btn btn-secondary" data-theme="twilight" aria-pressed="${currentTheme==='twilight'}">🌙 Twilight Garden</button></div><div class="toggle-row" style="margin-top:15px"><div><strong>High contrast</strong><small>Increase contrast for easier reading.</small></div><button class="switch" id="contrastSwitch" role="switch" aria-label="High contrast mode" aria-checked="${highContrast}"></button></div></section><section class="settings-panel floral-themes-panel"><h2>Flower color palettes</h2><p>Each theme is named for a flower and its matching color family. Your pick applies across the homepage, game cards, settings, and supported game panels, then saves on this device.</p><div class="floral-theme-grid">${floralThemes.map(t=>`<button class="floral-theme-card" type="button" data-floral-theme="${t.id}" aria-pressed="${activeFloral===t.id}"><span class="floral-theme-flower" style="--theme-bg:${t.colors.bg};--theme-petal:${t.colors.coral};--theme-center:${t.colors.yellow}" aria-hidden="true">${t.flower}</span><span class="floral-theme-copy"><strong>${t.name}</strong><small>${t.colorLabel}</small><em>${t.description}</em></span></button>`).join('')}</div><p class="fine-print">Iris Twilight is the dark palette. High contrast remains independent and takes priority for readability.</p></section><section class="settings-panel"><h2>Background color</h2><p>Pick a preset, or enter your own six-digit hex color.</p><div class="swatches">${swatches.map(([name,color])=>`<button class="swatch" data-color="${color}" style="background:${color}" aria-pressed="${currentBackground===color}">${name}<span>${color}</span></button>`).join('')}</div><div class="hex-row"><label class="sr-only" for="hexInput">Custom hex color</label><input id="hexInput" inputmode="text" placeholder="#fff8e9" maxlength="7" value="${escapeHTML(currentBackground)}"><button class="btn btn-primary btn-small" id="applyHex">Apply</button></div><button class="btn btn-secondary btn-small" id="resetBg" style="margin-top:9px">Reset to theme default</button></section><section class="settings-panel"><h2>Google Search setup</h2><p><strong>Regular Google works without a code.</strong> When no Search Engine ID is saved, the main search bar opens regular Google Search in the same browser tab (not a new tab). Use Back to return to CaydenProxy.</p><p>Optional: add a Google Programmable Search Engine ID (<code>cx</code>) to show its supported results inside CaydenProxy instead. This is a different, configurable search product and may focus on selected websites.</p><form id="searchSetup" class="tool-form"><div class="field"><label for="cxInput">Optional Search Engine ID (cx)</label><input id="cxInput" value="${escapeHTML(sessionStorage.getItem('cp-cx')||'')}" placeholder="Leave blank for regular Google"></div><button class="btn btn-green" type="submit">Save for this session</button><button class="btn btn-secondary btn-small" id="clearCx" type="button">Clear configuration</button></form><div class="notice" style="margin-top:13px">You do not need an API key for regular Google Search. Only set up a <code>cx</code> if you specifically want the embedded Programmable Search results panel. Follow your school’s technology policies.</div></section><section class="settings-panel"><h2>Fine-tune your vibe</h2><p>More choices for how CaydenProxy looks and moves. These preferences persist on this device when browser storage is available.</p><div class="customize-row"><label for="accentColorInput"><strong>Accent color</strong></label><input id="accentColorInput" type="color" value="${escapeHTML(accentColor)}" aria-label="Custom accent color"><button class="btn btn-primary btn-small" id="applyAccent" type="button">Apply accent</button></div><div class="customize-row"><label for="textScaleSelect"><strong>Text size</strong></label><select id="textScaleSelect"><option value="90">Compact · 90%</option><option value="100">Standard · 100%</option><option value="110">Large · 110%</option><option value="120">Extra large · 120%</option></select></div><div class="customize-row"><label for="cardLayoutSelect"><strong>Game cards</strong></label><select id="cardLayoutSelect"><option value="comfy">Comfy spacing</option><option value="compact">Compact grid</option></select></div><div class="toggle-row"><div><strong>Reduce animations</strong><small>Turn off motion effects for a calmer page.</small></div><button class="switch" id="motionSwitch" role="switch" aria-label="Reduce animations" aria-checked="${!motionEnabled}"></button></div><div class="toggle-row"><div><strong>Show big flower art</strong><small>Hide the large decorative blossom on the homepage.</small></div><button class="switch" id="petalsSwitch" role="switch" aria-label="Show decorative flower art" aria-checked="${petalsEnabled}"></button></div><button class="btn btn-secondary btn-small" id="resetPersonalization" type="button" style="margin-top:13px">Reset custom preferences</button></section><section class="settings-panel"><h2>Bloom AI setup</h2><p>The built-in study buddy works in local demo mode. To turn on generative AI, run the included Node server and set an API key in your server environment.</p><div class="notice"><strong>Keep keys private.</st function wireProfileBackup(){
 const exportButton=$('#exportCPBackup'),fileInput=$('#importCPBackupFile'),status=$('#backupStatus');
 const localAllowed=['cp-garden-profile','cp-premium-v1','cp-question-engine-v1','cp-journal','cp-focus-goal','cp-music-volume','cp-accent','cp-text-scale','cp-card-layout','cp-motion','cp-petals'];

function renderScrambleGame(){
 const mount=$('#gameMount');
 const bank=[
  ['planet','A large world that travels around a star.'],
  ['habitat','The natural home of a plant or animal.'],
  ['fraction','A number that represents part of a whole.'],
  ['compass','A tool that helps you find directions.'],
  ['gravity','The force that pulls objects toward each other.'],

  ['decimal','A number written using a decimal point.'],
  ['ecosystem','A community of living things and their environment.']
 ];
 const challenge=shuffle(bank).slice(0,5);
 let index=0,firstTryWins=0,missesThisWord=0,solved=false,finished=false;
 function finish(){
  if(finished)return;
  finished=true;
  saveGameBest('scramble',firstTryWins);
  recordGameCompletion('scramble',firstTryWins,challenge.length);
  const pct=Math.round(firstTryWins/challenge.length*100);
  mount.innerHTML=`<div class="sport-stage game-clear-screen"><div class="little-label">🌿 WORD GARDEN · CHALLENGE COMPLETE</div><h3>${pct===100?'Perfect word bloom! ✨':pct>=60?'Your vocabulary is growing! 🌼':'Keep practicing — every word helps! 🌱'}</h3><p>You solved all five words. The score counts words solved on your first try.</p><div class="hub-result-score">${firstTryWins}<span> / ${challenge.length} first-try solves</span></div><div class="hub-result-meter" role="progressbar" aria-label="First-try word score" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div><p>${pct===100?'Amazing focus — every word was right on the first try.':'You can replay the challenge to improve your first-try score.'}</p><div class="game-clear-actions"><button class="btn btn-primary" id="scrambleAgain" type="button">New word challenge ↻</button><button class="btn btn-secondary" data-route="games" type="button">Back to Games Hub</button></div></div>`;
  $('#scrambleAgain')?.addEventListener('click',()=>renderScrambleGame());
 }
 function render(){
  if(finished)return;
  if(index>=challenge.length){finish();return;}
  const [word,clue]=challenge[index];
  let mixed=word.split('').sort(()=>Math.random()-.5).join(''),tries=0;
  while(mixed===word&&tries++<8)mixed=word.split('').reverse().join('');
  solved=false;missesThisWord=0;
  mount.innerHTML=`<div class="question-box"><div class="little-label">Word garden · word ${index+1} of ${challenge.length}</div><h3>Can you untangle this word?</h3><p>Use the clue and rearrange the letters. Solve five words to finish the challenge.</p><div class="hub-result-meter quiz-progress" role="progressbar" aria-label="Words completed" aria-valuemin="0" aria-valuemax="${challenge.length}" aria-valuenow="${index}"><span style="width:${index/challenge.length*100}%"></span></div></div><div class="game-type-panel"><div class="scramble-word" aria-label="Scrambled letters">${escapeHTML(mixed.toUpperCase())}</div><p style="text-align:center;margin:0 0 14px"><strong>Clue:</strong> ${escapeHTML(clue)}</p><form id="scrambleForm" class="input-action-row"><label class="sr-only" for="scrambleInput">Unscrambled word</label><input id="scrambleInput" autocomplete="off" autocapitalize="none" placeholder="Type the word…" required><button class="btn btn-primary" type="submit">Check word</button></form><div class="feedback" id="scrambleFeedback" aria-live="polite"></div><div class="game-status"><span>🌱 First-try solves: <strong id="scrambleScore">${firstTryWins}</strong></span><span>Words completed: ${index}/${challenge.length}</span></div><div style="text-align:center;margin-top:15px"><button class="btn btn-secondary" id="nextScramble" type="button" hidden>${index===challenge.length-1?'See results →':'Next word →'}</button><button class="btn btn-secondary btn-small" id="scrambleHint" type="button">Show first letter</button></div></div>`;
  $('#scrambleForm').addEventListener('submit',e=>{
   e.preventDefault();if(solved||finished)return;
   const answer=$('#scrambleInput').value.trim().toLowerCase(),fb=$('#scrambleFeedback');
   if(answer===word){
    solved=true;index++;
    if(missesThisWord===0)firstTryWins++;
    saveGameBest('scramble',firstTryWins);registerCorrectAnswer();
    fb.textContent=missesThisWord===0?'Perfect first try! Word petals collected 🌼':'Got it! Learning is part of the game 🌷';
    fb.className='feedback good';$('#scrambleScore').textContent=firstTryWins;
    $('#scrambleInput').disabled=true;$('#scrambleForm button').disabled=true;
    $('#nextScramble').hidden=false;$('#nextScramble').focus();
    $('#nextScramble').textContent=index>=challenge.length?'See results →':'Next word →';
    const completedLabel=$('.game-status span:last-child',mount);if(completedLabel)completedLabel.textContent=`Words completed: ${index}/${challenge.length}`;
    const progress=$('.quiz-progress span',mount);if(progress)progress.style.width=`${index/challenge.length*100}%`;
    const progressbar=$('.quiz-progress',mount);if(progressbar)progressbar.setAttribute('aria-valuenow',String(index));
   }else{
    missesThisWord++;fb.textContent='Not quite yet — use the clue and check every letter.';fb.className='feedback bad';$('#scrambleInput').select();
   }
  });
  $('#nextScramble').addEventListener('click',()=>{if(index>=challenge.length){finish();return;}render()});
  $('#scrambleHint').addEventListener('click',()=>showToast(`The word starts with “${word[0].toUpperCase()}”.`));
  $('#scrambleInput').focus();
 }
 render();
}

function renderBasketballGame(){const mount=$('#gameMount');let shots=0,baskets=0,meter=0,direction=1,target=42,locked=false;function drawFinal(){if(gameTimer){clearInterval(gameTimer);gameTimer=null}saveGameBest('basketball',baskets);recordGameCompletion('basketball',baskets,5);awardXP(baskets*3+3,'Hoops Time match');mount.innerHTML=`<div class="sport-stage"><div class="little-label">Hoops Time · final buzzer</div><h3>${baskets>=4?'Nothing but net! 🏀':baskets>=2?'Good shots! 🌟':'Keep practicing your timing! 🌱'}</h3><p>You made ${baskets} of 5 shots.</p><button class="btn btn-primary" id="hoopsAgain" type="button">Play another round</button></div>`;$('#hoopsAgain').addEventListener('click',()=>renderBasketballGame())}function beginMeter(){target=rand(15,70);locked=false;meter=rand(0,100);direction=1;$('#hoopsTarget').style.left=target+'%';$('#hoopsMeterMarker').style.left=meter+'%';$('#hoopsStatus').textContent='Shoot when the moving coral marker is inside the green zone.';$('#shootBall').disabled=false;if(gameTimer)clearInterval(gameTimer);gameTimer=setInterval(()=>{if(locked)return;meter+=direction*2.2;if(meter>=99){meter=99;direction=-1}if(meter<=1){meter=1;direction=1}const marker=$('#hoopsMeterMarker');if(marker)marker.style.left=meter+'%'},28)}function render(){if(shots>=5){drawFinal();return}mount.innerHTML=`<div class="sport-stage"><div class="little-label">Hoops Time · shot ${shots+1} of 5</div><h3>Catch the green zone! 🏀</h3><div class="sport-score"><span>Baskets: <strong>${baskets}</strong></span><span>Shots taken: <strong>${shots}</strong>/5</span></div><div aria-label="Timing meter from 0 to 100"><div class="meter-wrap"><span id="hoopsTarget" class="meter-target" style="left:${target}%;width:15%"></span><span id="hoopsMeterMarker" class="meter-marker" style="left:${meter}%"></span></div><div style="display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem"><span>Too early</span><span>Sweet spot</span><span>Too late</span></div></div seStart=Date.now();delay=rand(700,1700);const status=$('#rallyStatus'),hit=$('#rallyHit'),ball=$('#rallyBall');if(status)status.textContent='Too slow that time — keep your eyes ready.';if(hit)hit.disabled=true;if(ball)ball.textContent='🏓';if(round>=8)finish()}},35)}
function renderRhythmGame(){const mount=$('#gameMount');const pads=[['🌼','petal'],['💧','drop'],['🍃','leaf'],['⭐','star']];let sequence=[],input=[],level=1,locked=false,score=0;function nextLevel(){sequence.push(rand(0,pads.length-1));input=[];locked=false;draw()}function draw(message='Watch the pattern, then repeat it!'){mount.innerHTML=`<div class="sport-stage"><div class="little-label">Rhythm Roots · level ${level}</div><h3>Repeat the garden beat. 🥁</h3><div class="sport-score"><span>Level: <strong>${level}</strong></span><span>Longest streak: <strong>${score}</strong></span></div><p class="sport-feedback" id="rhythmStatus" aria-live="polite">${escapeHTML(message)}</p><div class="sport-lanes" role="group" aria-label="Beat pads">${pads.map(([icon,name],i)=>`<button class="sport-lane" data-beat="${i}" type="button" aria-label="${name} beat">${icon}<br>${name}</button>`).join('')}</div><div style="text-align:center;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn btn-primary" id="rhythmShow" type="button">▶ Show pattern</button><button class="btn btn-secondary" id="rhythmReset" type="button">Start over</button></div></div>`;$$('[data-beat]',mount).forEach(b=>b.addEventListener('click',()=>{if(locked||!sequence.length)return;const n=+b.dataset.beat;input.push(n);if(sequence[input.length-1]!==n){locked=true;$('#rhythmStatus').textContent='Almost! Watch the pattern again and try a fresh round.';$('#rhythmShow').textContent='Try pattern again';sequence=[];input=[];level=1;return}b.style.background='var(--panel2)';setTimeout(()=>{if(b.isConnected)b.style.background=''},160);if(input.length===sequence.length){score=Math.max(score,level);if(level===5){saveGameBest('rhythm',5);recordGameCompletion('rhythm',5,5)}awardXP(3,'Rhythm Roots level');level++;$('#rhythmStatus').textContent='Perfect rhythm! The next pattern adds one more beat.';locked=true;$('#rhythmShow').textContent='Next level →'}}));$('#rhythmShow').addEventListener('click',()=>{if(locked&&sequence.length&&input.length===sequence.length){nextLevel();return}if(!sequence.length){sequence=[];level=1;score=0;sequence.push(rand(0,pads.length-1))}input=[];locked=true;const status=$('#rhythmStatus');status.textContent='Watch carefully…';sequence.forEach((n,i)=>setTimeout(()=>{const b=$$('[data-beat]',mount)[n];if(b){b.style.background='var(--yellow)';setTimeout(()=>{if(b.isConnected)b.style.background=''},220)}if(i===sequence.length-1)setTimeout(()=>{locked=false;status.textContent='Your turn — repeat the beats in order.'},280)},i*550));$('#rhythmShow').textContent='Pattern shown'});$('#rhythmReset').addEventListener('click',()=>{sequence=[];input=[];level=1;score=0;nextLevel()})}sequenceInitRhythm();function sequenceInitRhythm(){sequence=[];input=[];level=1;score=0;draw('Press Show pattern to begin.')}}

function showQuestion(){
 const mount=$('#gameMount');if(!mount||!gameState)return;
 const id=gameState.id,meta=games.find(g=>g.id===id),engine=window.CaydenQuestionEngine;
 let q;
 if(engine){
  if(!gameState.questionSession){const subject=engine.subjectForGame(id,meta?.category);gameState.questionSubject=subject;gameState.questionSession=engine.createSession(subject)}
  const stages=['Easy','Medium','Hard','Expert','Challenge'];
  q=gameState.questionSession.next(stages[Math.min(gameState.round,stages.length-1)]);
 }else{const bank=questions[id]||questions.math;const factory=bank[rand(0,bank.length-1)];q=factory()}
 gameState.question=q;gameState.answered=false;
 const questionNumber=gameState.round+1,progressPct=Math.round(questionNumber/QUIZ_CHALLENGE_LENGTH*100),typed=['typing','fill-in-the-blank'].includes(q.type);
 const typeLabels={'multiple-choice':'Multiple choice','true-false':'True / False','matching':'Match the clue','typing':'Typed answer','fill-in-the-blank':'Fill in the blank','visual-identification':'Visual identification','puzzle-solving':'Puzzle solving','scenario-based':'Scenario challenge'};
 const answerMarkup=typed?`<form id="typedAnswerForm" class="quiz-typed-response"><label for="typedAnswer">${q.type==='typing'?'Type your answer':'Complete the missing answer'}</label><input id="typedAnswer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="typedAnswerHelp" placeholder="Your answer…" required><p id="typedAnswerHelp" class="fine-print">Press Enter or use Check answer. Answers are checked locally.</p><button class="btn btn-primary" id="typedAnswerSubmit" type="submit">Check answer</button></form>`:`<div class="answer-grid">${(q.opts||[]).map((opt,i)=>`<button class="answer-btn" data-answer="${escapeHTML(opt)}" type="button">${escapeHTML(opt)}</button>`).join('')}</div>`;
 mount.innerHTML=`<div class="question-box"><div class="little-label">Question ${questionNumber} of ${QUIZ_CHALLENGE_LENGTH} · ${escapeHTML(q.difficulty||'Garden challenge')}</div><h3>${escapeHTML(q.q)}</h3><p class="qe-type-label">${escapeHTML(typeLabels[q.type]||'Multiple choice')} · ${escapeHTML(q.subject||gameState.questionSubject||'Learning')}</p><p>Collect a petal by solving each question. Finish all five levels to record a challenge result.</p><div class="hub-result-meter quiz-progress" role="progressbar" aria-label="Challenge progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progressPct}"><span style="width:${progressPct}%"></span></div></div>${answerMarkup}<div class="feedback" id="gameFeedback" aria-live="polite"></div><div class="game-status"><span>🌱 Score: <strong id="scoreVal">${gameState.score}</strong></span><span>Round total: 5 questions</span></div><div style="text-align:center;margin-top:18px"><button class="btn btn-primary" id="nextQuestion" hidden>${questionNumber===QUIZ_CHALLENGE_LENGTH?'Finish challenge →':'Next question →'}</button><button class="btn btn-secondary btn-small" id="showHint" type="button">Need a hint?</button></div>`;
 $$('[data-answer]',mount).forEach(btn=>btn.addEventListener('click',()=>answerGame(btn)));
 $('#typedAnswerForm',mount)?.addEventListener('submit',answerTypedGame);
 $('#nextQuestion',mount).addEventListener('click',()=>{if(gameState.round+1>=QUIZ_CHALLENGE_LENGTH){finishQuizChallenge();return}gameState.round++;showQuestion()});
 $('#showHint',mount).addEventListener('click',()=>showToast(q.hint||'Look for a clue in the question.'));
 if(typed)$('#typedAnswer',mount)?.focus({preventScroll:true});
}
function answerGame(btn){if(!gameState||gameState.answered||gameState.finished)return;gradeCurrentAnswer(btn.dataset.answer,btn)}
function answerTypedGame(event){event.preventDefault();if(!gameState||gameState.answered||gameState.finished)return;const input=$('#typedAnswer');if(!input)return;gradeCurrentAnswer(input.value,null)}
function gradeCurrentAnswer(value,chosenButton){
 if(!gameState||gameState.answered||gameState.finished)return;
 const q=gameState.question,engine=window.CaydenQuestionEngine;
 const submitted=engine?.normalizeAnswer?engine.normalizeAnswer(value):String(value??'').trim().toLocaleLowerCase();
 const accepted=(q.acceptedAnswers||[q.ans]).map(v=>engine?.normalizeAnswer?engine.normalizeAnswer(v):String(v??'').trim().toLocaleLowerCase());
 const correct=accepted.includes(submitted);
 gameState.answered=true;
 $$('[data-answer]').forEach(b=>{b.disabled=true;if((engine?.normalizeAnswer?engine.normalizeAnswer(b.dataset.answer):String(b.dataset.answer).trim().toLocaleLowerCase())===(engine?.normalizeAnswer?engine.normalizeAnswer(q.ans):String(q.ans).trim().toLocaleLowerCase()))b.classList.add('correct')});
 const input=$('#typedAnswer'),submit=$('#typedAnswerSubmit');if(input)input.disabled=true;if(submit)submit.disabled=true;
 if(chosenButton&&!correct)chosenButton.classList.add('incorrect');
 const feedback=$('#gameFeedback');
 if(correct){gameState.score++;saveGameBest(gameState.id,gameState.score);registerCorrectAnswer();feedback.textContent='That’s right! Your garden grew a little 🌼';feedback.className='feedback good'}
 else{feedback.textContent=`Good try — the answer is ${q.ans}. ${q.explanation||'Review the clue and try a new round.'}`;feedback.className='feedback bad'}
 try{engine?.recordAnswer?.(q,correct)}catch(err){console.warn('Question statistics could not be saved',err)}
 $('#scoreVal').textContent=gameState.score;$('#nextQuestion').hidden=false;$('#nextQuestion').focus();
}

-label',`Hidden flower ${f.card.i+1}`);first=null;lock=false},650)}}))}

function categoryFor(g){return questionSets[g[3]]?g[3]:['Math','Science','Language','Logic','Typing','Music','Sports','Learning'].includes(g[3])?g[3]:g[0]==='wingeria'?'Arcade':g[3]==='Study'?'Learning':g[3]==='Creative'?'Logic':g[3]==='Memory'?'Logic':g[3]==='Coding'?'Typing':g[3]==='Arcade'?'Sports':'Learning'}
function startGame(id){stopRound();const g=games.find(x=>x[0]===id)||games[0];data.history=[...data.history.filter(x=>x!==id),id].slice(-30);persist();try{window.CaydenArcadeHub?.recordPlay?.(id)}catch(err){console.warn('Shared game history hook failed',err)}if(window.CaydenArcadePlus&&typeof window.CaydenArcadePlus.startGame==='function'&&window.CaydenArcadePlus.startGame(id,g))return;if(id==='wingeria'){wingeria(g);return}if(['pixel','drawing','animation','musicmaker'].includes(id)){creativeGame(g);return}if(id==='focus'){focusGame(g);return}if(id==='maze'||id==='sudoku'||id==='memorymatch'||id==='memory'||id==='musicalmemory'||id==='piano'||id==='rhythm'||id==='beatmatch'||id==='soccer'||id==='basketball'||id==='baseball'||id==='minigolf'){arcadeMechanic(g);return}quizGame(g)}
function quizGame(g){const cat=categoryFor(g),set=questionSets[cat]||questionSets.Logic;round={g,cat,index:0,score:0,hearts:3,combo:0,bestCombo:0,seconds:60,questions:[],questionMeta:[]};const engine=window.CaydenQuestionEngine;if(engine){try{const subject=engine.subjectForGame(g[0],cat),session=engine.createSession(subject,{types:['multiple-choice']});for(let i=0;i<10;i++){const q=session.next(['Easy','Easy','Medium','Medium','Hard','Hard','Expert','Expert','Challenge','Challenge'][i]);round.questions.push([q.q,q.opts,q.ans]);round.questionMeta.push(q)}}catch(err){console.warn('Shared question engine unavailable; using the Arcade’s local bank.',err)}}if(!round.questions.length){while(round.questions.length<10){const q=set[Math.floor(Math.random()*set.length)];if(!round.questions.includes(q))round.questions.push(q);if(round.questions.length<10&&set.length<10)round.questions.push(q.map((v,i)=>i===1?[...v].sort(()=>Math.random()-.5):v))}round.questions=round.questions.slice(0,10).map(q=>[q[0],q[1],q[2]])}renderQuiz(g);roundTimer=setInterval(()=>{if(!round)return;round.seconds--;const t=content.querySelector('#cp-clock');if(t)t.textContent=round.seconds+'s';if(round.seconds<=0)endQuiz(false,'Time is up!');},1000)}
function renderQuiz(g,feedback=''){if(!round)return;const q=round.questions[round.index];content.innerHTML=`<div data-game-view><div class="cp-game-top"><span style="font-size:2.4rem">${g[2]}</span><div style="flex:1"><div class="cp-chip">${esc(g[3])} · LEVEL ${Math.max(1,Math.floor(data.wins/3)+1)}</div><h2>${esc(g[1])}</h2><p class="cp-muted">${esc(g[4])}</p></div><button class="cp-btn" id="cp-exit">← Arcade</button></div><div class="cp-progressline"><span>Question ${round.index+1}/10</span><div class="cp-meter"><span style="width:${round.index*10}%"></span></div><span id="cp-clock">${round.seconds}s</span></div><div class="cp-row"><span class="cp-badge">⭐ ${round.score*10} pts</span><span class="cp-badge">❤️ ${'♥'.repeat(round.hearts)}${'♡'.repeat(3-round.hearts)}</span><span class="cp-badge">⚡ Combo ×${round.combo}</span><span class="cp-badge">Difficulty ${Math.min(5,1+Math.floor(round.index/2))}</span></div><div class="cp-panel" style="margin-top:15px"><div class="cp-chip">THINK IT THROUGH</div><div class="cp-question">${esc(q[0])}</div><div class="cp-answer-grid">${q[1].map((a,i)=>`<button class="cp-answer" data-answer="${esc(a)}">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div><div class="cp-feedback" role="status" aria-live="polite">${feedback||'Correct answers grow your combo. Three mistakes end the round.'}</div><div class="cp-row"><button class="cp-btn" id="cp-hint">💡 Hint (-5 points)</button><button class="cp-btn" id="cp-skip">Skip (-1 heart)</button></div></div><p class="cp-access-note">Keyboard friendly · Reduced-motion preferences respected · Progress saved locally</p></div>`;content.querySelector('#cp-exit').onclick=home;content.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer,b));content.querySelector('#cp-skip').onclick=()=>{round.hearts--;round.combo=0;advance(false,'Skipped — keep going!')};content.querySelector('#cp-hint').onclick=()=>{const good=q[2];content.querySelectorAll('[data-answer]').f function answer(value,b){if(!round)return;const correct=value===round.questions[round.index][2];try{window.CaydenQuestionEngine?.recordAnswer?.(round.questionMeta?.[round.index],correct)}catch(err){console.warn('Arcade question stats could not be saved',err)}content.querySelectorAll('[data-answer]').forEach(x=>{x.disabled=true;if(x.dataset.answer===round.questions[round.index][2])x.classList.add('good')});if(!correct){b.classList.add('bad');round.hearts--;round.combo=0;advance(false,'Not quite — the highlighted answer is correct. Use it as a clue for next time.')}else{round.score++;round.combo++;round.bestCombo=Math.max(round.bestCombo,round.combo);if(data.sfx)beep(660);rewardParticles(b);advance(true,round.combo>=3?'Combo x'+round.combo+'! Nice run!':'Correct! +10 points') }}
function advance(correct,msg){if(!round)return;const r=round;content.querySelector('.cp-feedback').textContent=msg;if(!correct&&r.hearts<=0){setTimeout(()=>endQuiz(false,'You ran out of hearts. Practice makes progress!'),500);return}r.index++;if(r.index>=10){setTimeout(()=>endQuiz(r.score>=7,'Round complete!'),450);return}setTimeout(()=>{if(round===r)renderQuiz(r.g,msg)},correct?500:850)}
function endQuiz(win,msg){if(!round)return;const r=round;stopRound();if(win)data.wins++;const xp=Math.max(5,r.score*4+(win?20:0)+r.bestCombo*2);addXP(xp,r.g[1]);if(r.bestCombo>=5)unlock('combo');const old=data.bests[r.g[0]]||0;data.bests[r.g[0]]=Math.max(old,r.score);persist();header();content.innerHTML=`<div data-game-view class="cp-result"><div class="big">${win?'🏆':'🌱'}</div><div class="cp-chip">${win?'MISSION COMPLETE':'PRACTICE ROUND'}</div><h2>${win?'You did it!':'Keep growing!'}</h2><p>${esc(msg)} You got <strong>${r.score}/10</strong> correct.</p><div class="cp-stats"><div class="cp-stat"><strong>${r.score*10}</strong><small>Score</small></div><div class="cp-stat"><strong>+${xp} XP</strong><small>Earned</small></div><div class="cp-stat"><strong>${r.bestCombo}×</strong><small>Best combo</small></div><div class="cp-stat"><strong>${data.bests[r.g[0]]}/10</strong><small>Personal best</small></div></div><div class="cp-row" style="justify-content:center;margin-top:18px"><button class="cp-btn hot" id="cp-retry">Play again</button><button class="cp-btn" id="cp-home">Arcade home</button></div></div>`;content.querySelector('#cp-retry').onclick=()=>startGame(r.g[0]);content.querySelector('#cp-home').onclick=home}
function beep(freq=550){try{if(data.muted||data.volume===0)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),gain=c.createGain();o.type='sine';o.frequency.value=freq;gain.gain.value=(data.volume/100)*.07;o.connect(gain);gain.connect(c.destination);o.start();gain.gain.exponentialRampToValueAtTime(.001,c.currentTime+.15);o.stop(c.currentTime+.16);o.onended=()=>c.close()}catch(_){}}
function wingeria(g){stopRound();const customerNames=['Maya','Jordan','Kai','Riley','Alex','Sam','Taylor','Casey'];const sauces=['Honey BBQ','Buffalo Blaze','Lemon Pepper','Garlic Parm','Sweet Chili'];const sides=['Curly Fries','Garden Slaw','Corn Bites','Potato Wedges'];const doneness=['Light crisp','Golden','Extra crispy'];const orders=[];for(let i=0;i<5;i++)orders.push({name:customerNames[Math.floor(Math.random()*customerNames.length)],sauce:sauces[Math.floor(Math.random()*sauces.length)],side:sides[Math.floor(Math.random()*sides.length)],doneness:doneness[Math.floor(Math.random()*doneness.length)],wings:4+Math.floor(Math.random()*3)});round={g,orders,order:0,station:0,chosen:{sauce:sauces[0],side:sides[0],doneness:doneness[1],wings:6},score:0,money:0,served:0,patience:100,combo:0,bestCombo:0,seconds:120,perfect:0};renderWingeria();roundTimer=setInterval(()=>{if(!round)return;round.seconds--;if(round.station===1)round.patience=Math.max(0,round.patience-.28);const clock=content.querySelector('#wing-clock'),pat=content.querySelector('#wing-patience');if(clock)clock.textContent=round.seconds+'s';if(pat)pat.style.width=round.patience+'%';if(round.seconds<=0||round.patience<=0)endWingeria(false);},1000)}
function renderWingeria(msg=''){if(!round)return;const r=round,o=r.orders[r.order];if(!o){endWingeria(true);return}const stationNames=['🧾 Take Order','🍳 Fry Station','🌶️ Sauce Station','🍽️ Plating','⭐ Serve'];content.innerHTML=`<div data-game-view><div class="cp-game-top"><span style="font-size:2.7rem">🍗</span><div style="flex:1"><div class="cp-chip">SHIFT ${r.order+1}/5 · WING WORKSHOP</div><h2>Wingeria Rush Remastered</h2><p class="cp-muted">Take the ticket, fry wings, toss the sauce, plate the sides, then serve!</p></div><button class="cp-btn" id="cp-exit">← Arcade</button></div><div class="cp-progressline"><span>⏱ <b id="wing-clock">${r.seconds}s</b></span><div class="cp-meter"><span id="wing-patience" style="width:${r.patience}%"></span></div><span>Customer patience</span></div><div class="cp-row" style="margin-bottom:14px"><span class="cp-badge">💵 Tips $${r.money}</span><span class="cp-badge">⭐ Score ${r.score}</span><span class="cp-badge">🔥 Combo ×${r.combo}</span></div><div class="cp-wingeria"><section class="cp-station"><h3>${stationNames[r.station]}</h3><p>${['Read the ticket and remember the order.','Pick the requested wing count and fry level.','Choose the sauce the customer requested.','Choose the matching side and build the tray.','Check your ticket, then send it to the customer.'][r.station]}</p><div class="cp-order-ticket"><strong>🎟️ ${esc(o.name)}’s ticket</strong>${r.station===0?`Wings: ${o.wings}<br>Fry: ${esc(o.doneness)}<br>Sauce: ${esc(o.sauce)}<br>Side: ${esc(o.side)}`:`Ticket details: ${r.station>=1?'🍗 '+o.wings+' wings · ':''}${r.station>=2?'🌶️ '+esc(o.sauce)+' · ':''}${r.station>=3?'🥔 '+esc(o.side):''}`} </div><div style="margin-top:13px" class="cp-wing-board" aria-label="Kitchen station illustration">${['📋 Ticket ready','🍳 '+(r.chosen.doneness==='Extra crispy'?'🔥':'✨')+' Frying wings','🌶️ Toss, toss, toss!','🍽️ Build a beautiful tray','🛎️ Ready to serve!'][r.station]}</div></section><section class="cp-station"><h3>Kitchen controls</h3><p>M function creativeGame(g){if(g[0]==='musicmaker'){content.innerHTML=`<div data-game-view><div class="cp-game-top"><span style="font-size:2.5rem">🎼</span><div style="flex:1"><h2>Music Maker</h2><p class="cp-muted">Tap keys to compose an original little melody.</p></div><button class="cp-btn" id="cp-exit">← Arcade</button></div><div class="cp-panel"><div class="cp-row">${[261.6,293.7,329.6,349.2,392,440,493.9,523.3].map((f,i)=>`<button class="cp-btn" data-note="${f}" style="min-height:110px;flex:1;background:${['#ffd7e0','#ffe5b0','#fff2a5','#d9f4c8','#c9f0e5','#cfe9ff','#dfd4ff','#f8d3f0'][i]};color:#392d48">${['C','D','E','F','G','A','B','C'][i]}<br>♪</button>`).join('')}</div><p id="cp-melody" class="cp-muted">Your melody: nothing played yet.</p><button class="cp-btn hot" id="cp-replay">▶ Replay melody</button><button class="cp-btn" id="cp-save-melody">Save melody note</button></div></div>`;let notes=[];content.querySelector('#cp-exit').onclick=home;content.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{notes.push(Number(b.dataset.note));notes=notes.slice(-24);beep(Number(b.dataset.note));content.querySelector('#cp-melody').textContent='Your melody: '+notes.length+' notes saved in this session.';});content.querySelector('#cp-replay').onclick=()=>notes.forEach((f,i)=>setTimeout(()=>beep(f),i*220));content.querySelector('#cp-save-melody').onclick=()=>{addXP(10,'Music Maker');toast('🎵 Melody saved for this session! +10 XP')};return}

function focusGame(g){content.innerHTML=`<div data-game-view><div class="cp-game-top"><span style="font-size:2.5rem">⏱️</span><div style="flex:1"><h2>Focus Flow</h2><p class="cp-muted">Choose a calm sprint and focus on one small thing.</p></div><button class="cp-btn" id="cp-exit">← Arcade</button></div><div class="cp-result"><div class="big" id="focus-emoji">🌿</div><div style="font-size:3rem;font-weight:1000" id="focus-time">05:00</div><div class="cp-row" style="justify-content:center;margin-top:14px"><button class="cp-btn" data-min="1">1 min</button><button class="cp-btn" data-min="5">5 min</button><button class="cp-btn" data-min="10">10 min</button></div><div class="cp-row" style="justify-content:center;margin-top:12px"><button class="cp-btn hot" id="focus-start">Start focus</button><button class="cp-btn" id="focus-reset">Reset</button></div><p id="focus-status" class="cp-muted">Put one small task first. Breaks are allowed.</p></div></div>`;let seconds=300,timer=null;const fmt=()=>content.querySelector('#focus-time').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');content.querySelector('#cp-exit').onclick=()=>{if(timer)clearInterval(timer);home()};content.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{if(timer)return;seconds=Number(b.dataset.min)*60;fmt()});content.querySelector('#focus-start').onclick=()=>{if(timer){clearInterval(timer);timer=null;content.querySelector('#focus-start').textContent='Resume focus';return}content.querySelector('#focus-start').textContent='Pause focus';timer=setInterval(()=>{seconds--;fmt();if(seconds<=0){clearInterval(timer);timer=null;content.querySelector('#focus-status').textContent='Lovely focus session complete!';addXP(25,'Focus Flow');data.wins++;persist();}},1000)};content.querySelector('#focus-reset').onclick=()=>{if(timer)clearInterval(timer);timer=null;seconds=300;fmt();content.querySelector('#focus-start').textContent='Start focus'}}

function memoryGame(g){const icons=['🌻','🐝','🌷','🍄','🪴','🦋','🍓','🌈'];let seq=[],input=[],level=1;content.innerHTML=`<div data-game-view><div class="cp-game-top"><span style="font-size:2.5rem">${g[2]}</span><div style="flex:1"><h2>${esc(g[1])}</h2><p class="cp-muted">Watch the pattern, then repeat it. Each level adds one more.</p></div><button class="cp-btn" id="cp-exit">← Arcade</button></div><div class="cp-panel"><div class="cp-question" id="mem-prompt">Press Start to begin.</div><div class="cp-grid" style="grid-template-columns:repeat(4,minmax(0,1fr))">${icons.map((x,i)=>`<button class="cp-answer" data-mem="${i}" style="font-size:2rem;text-align:center;min-height:85px">${x}</button>`).join('')}</div><p id="mem-status" class="cp-feedback" role="status">Reach level 5 to win. Three mistakes end the run.</p><button class="cp-btn hot" id="mem-start">Start pattern</button></div></div>`;let hearts=3,showing=false;content.querySelector('#cp-exit').onclick=home;function next(){seq.push(Math.floor(Math.random()*icons.length));input=[];showing=true;content.querySelector('#mem-prompt').textContent='Watch the pattern · Level '+level;let i=0;function blink(){if(i>=seq.length){showing=false;content.querySelector('#mem-status').textContent='Your turn! Tap the sequence.';return}const b=content.querySelector(`[data-mem="${seq[i]}"]`);b.classList.add('good');setTimeout(()=>b.classList.remove('good'),350);i++;setTimeout(blink,520)}blink()}content.querySelector('#mem-start').onclick=()=>{seq=[];level=1;hearts=3;next()};content.querySelectorAll('[data-mem]').forEach(b=>b.onclick=()=>{if(showing||!seq.length)return;const n=Number(b.dataset.mem);beep(300+n*40);if(n===seq[input.length]){input.push(n);if(input.length===seq.length){level++;content.querySelector('#mem-status').textContent='Perfect sequence!';if(level>5){data.wins++;addXP(30+level*3,g[1]);content.querySelector('#mem-prompt').textContent='🏆 You mastered the pattern!';seq=[]}else setTimeout(next,650)}}else{hearts--;content.querySelector('#mem-status').textContent='Not that one. Hearts left: '+hearts;if(!hearts){addXP(level*3,g[1]);content.querySelector('#mem-prompt').textContent='Run ended at level '+level;seq=[]}}})}
function rhythmGame(g){const target=[0,2,1,3,2,0,3,1];let hits=0,combo=0,best=0,idx=0;content.innerHTML=`<div data-game-view><div class="cp-game-top"><span style="font-size:2.5rem">${g[2]}</span><div style="flex:1"><h2>${esc(g[1])}</h2><p class="cp-muted">Tap the pads in the shown sequence to build your rhythm combo.</p></div><button class="cp-btn" id="cp-exit">← Arcade</button></div><div class="cp-panel"><div class="cp-question" id="rhythm-prompt">Ready to make some noise?</div><div class="cp-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${['🥁 Kick','👏 Clap','✨ Bell','🪘 Tom'].map((x,i)=>`<button class="cp-answer" data-pad="${i}" style="font-size:1.25rem;text-align:center;min-height:95px">${x}</button>`).join('')}</div><p class="cp-feedback" id="rhythm-status" role="status">Eight beats. One missed beat breaks your combo.</p><button class="cp-btn hot" id="rhythm-start">Start beat</button></div></div>`;content.querySelector('#cp-exit').onclick=home;function play(i){content.querySelector('#rhythm-prompt').textContent='Beat '+(idx+1)+' of 8 · listen and tap';beep([140,270,520,200][i]);}content.querySelector('#rhythm-start').onclick=()=>{idx=0;hits=0;combo=0;best=0;play(target[idx])};content.querySelectorAll('[data-pad]').forEach(b=>b.onclick=()=>{if(!target||idx>=8)return;const n=Number(b.dataset.pad);if(n===target[idx]){hits++;combo++;best=Math.max(best,combo);b.classList.add('good');setTimeout(()=>b.classList.remove('good'),180);idx++;if(idx===8){data.wins++;addXP(20+hits*3,g[1]);content.querySelector('#rhythm-status').textContent='Beat cleared! Best combo '+best;content.querySelector('#rhythm-prompt').textContent='🏆 Rhythm champion!';idx=9}else play(target[idx])}else{combo=0;content.querySelector('#rhythm-status').textContent='Off beat — try the next cue. Combo reset.'}})}
function sportGame(g){let attempts=5,score=0;const labels={soccer:['⚽','Kick','goal'],basketball:['🏀','Shoot','hoop'],baseball:['⚾','Swing','hit'],minigolf:['⛳','Putt','cup']},l=labels[g[0]];let marker=Math.random();content.innerHTML=`<div data-game-view><div class="cp-game-top"><span style="font-size:2.5rem">${l[0]}</span><div style="flex:1"><h2>${esc(g[1])}</h2><p class="cp-muted">Time your move when the marker enters the green zone.</p></div><button class="cp-btn" id="cp-exit">← Arcade</button></div><div class="cp-field"><div style="font-size:4rem" id="sport-ball">${l[0]}</div><div class="cp-meter" style="max-width:520px;margin:15px auto;background:linear-gradient(90deg,#f88 0 36%,#9fe6a5 36% 62%,#f88 62%);height:18px;position:relative"><span id="sport-marker" style="position:absolute;top:-5px;left:0;width:8px;height:28px;background:#282343;border-radius:6px;transition:left .12s"></span></div><p id="sport-info">Attempts: 5 · Score: 0</p><button class="cp-btn hot" id="sport-action">${l[1]}!</button></div><p class="cp-feedback" id="sport-feedback" role="status">The marker moves. Press the button in the green zone for a perfect shot.</p></div>`;content.querySelector('#cp-exit').onclick=home;let pos=0,dir=1;roundTimer=setInterval(()=>{pos+=dir*2.6;if(pos>98||pos<0)dir*=-1;const m=content.querySelector('#sport-marker');if(m)m.style.left=pos+'%'},50);content.querySelector('#sport-action').onclick=()=>{if(attempts<=0)return;attempts--;const good=pos>=36&&pos<=62;score+=good?100:pos>=28&&pos<=70?35:0;content.querySelector('#sport-ball').textContent=good?'✨'+l[0]:score?'💨'+l[0]:'🫣'+l[0];content.querySelector('#sport-info').textContent='Attempts: '+attempts+' · Score: '+score;content.querySelector('#sport-feedback').textContent=good?'Perfect timing! +100':'Almost — try timing the green zone.';if(attempts===0){stopRound();const win=score>=200;data.wins+=win?1:0;addXP(Math.max(5,Math.floor(score/10)+(win?20:0)),g[1]);content.querySelector('#sport-feedback').textContent=(win?'🏆 Challenge cleared! ':'Round over. ')+score+' points. +XP earned.';content.querySelector('#sport-action').textContent='Play again';content.querySelector('#sport-action').onclick=()=>startGame(g[0])}}}
function sudokuGame(g){const puzzle=[[1,0,3,4],[3,4,0,2],[2,1,4,0],[0,3,2,1]],sol=[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]];let filled=0;content.innerHTML=`<div data-game-view><div class="cp-game-top"><span style="font-size:2.5rem">🔢</span><div style="flex:1"><h2>Mini Sudoku Sprint</h2><p class="cp-muted">Fill the blanks so each row contains 1–4 without repeats.</p></div><button class="cp-btn" id="cp-exit">← Arcade</button></div><div class="cp-panel"><div class="cp-grid" style="grid-template-columns:repeat(4,minmax(0,75px));justify-content:center;gap:5px">${puzzle.flatMap((row,r)=>row.map((v,c)=>`<input aria-label="Row ${r+1} column ${c+1}" data-cell="${r},${c}" class="cp-search" style="width:100%;text-align:center;font-size:1.3rem;font-weight:900;padding:10px 4px" value="${v||''}" ${v?'readonly':''} maxlength="1" inputmode="numeric">`)).join('')}</div><p class="cp-feedback" id="sudoku-status">Complete the grid and check your answer.</p><button class="cp-btn hot" id="sudoku-check">Check grid</button><button class="cp-btn" id="sudoku-hint">Hint</button></div></div>`;content.querySelector('#cp-exit').onclick=home;content.querySelector('#sudoku-hint').onclick=()=>{const blank=content.querySelector('input:not([readonly])');if(blank){const [r,c]=blank.dataset.cell.split(',').map(Number);blank.value=sol[r][c];blank.dataset.hint='1';content.querySelector('#sudoku-status').textContent='One hint filled in.'}};content.querySelector('#sudoku-check').onclick=()=>{let good=true;content.querySelectorAll('[data-cell]').forEach(inp=>{const [r,c]=inp.dataset.cell.split(',').map(Number);if(Number(inp.value)!==sol[r][c])good=false});if(good){data.wins++;addXP(35,'Sudoku Sprint');content.querySelector('#sudoku-status').textContent='🏆 Perfect grid! +35 XP';content.querySelector('#sudoku-check').disabled=true}else content.querySelector('#sudoku-status').textContent='Some cells need another look. Use the hint if stuck.'}}
function mazeGame(g){let pos=0,steps=0;const path=[0,1,3,2,5,4,7,6,8];content.innerHTML=`<div data-game-view><div class="cp-game-top"><span style="font-size:2.5rem">${g[2]}</span><div style="flex:1"><h2>${esc(g[1])}</h2><p class="cp-muted">Navigate the little maze to the flower. Wrong turns cost time.</p></div><button class="cp-btn" id="cp-exit">← Arcade</button></div><div class="cp-panel"><div id="maze-board" class="cp-grid" style="grid-template-columns:repeat(3,minmax(0,1fr));max-width:400px;margin:auto">${Array.from({length:9},(_,i)=>`<div data-maze="${i}" class="cp-answer" style="text-align:center;font-size:2rem;min-height:85px">${i===0?'🧑‍🌾':i===8?'🌻':'🌿'}</div>`).join('')}</div><div class="cp-row" style="justify-content:center;margin-top:12px"><button class="cp-btn" data-move="-3">↑</button><button class="cp-btn" data-move="-1">←</button><button class="cp-btn" data-move="1">→</button><button class="cp-btn" data-move="3">↓</button></div><p class="cp-feedback" id="maze-status" role="status">Moves: 0 · Use arrows to find the flower.</p></div></div>`;content.querySelector('#cp-exit').onclick=home;function draw(){content.querySelectorAll('[data-maze]').forEach((b,i)=>b.textContent=i===pos?'🧑‍🌾':i===8?'🌻':(Math.abs(i-pos)===1||Math.abs(i-pos)===3?'🌱':'🌳'));content.querySelector('#maze-status').textContent='Moves: '+steps+' · Find the flower at the bottom right.'}content.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const n=pos+Number(b.dataset.move);if(n<0||n>8||(Math.abs(Number(b.dataset.move))===1&&Math.floor(n/3)!==Math.floor(pos/3)))return;pos=n;steps++;draw();if(pos===8){data.wins++;addXP(Math.max(10,45-steps*2),'Maze Escape');content.querySelector('#maze-status').textContent='🏆 Maze escaped in '+steps+' moves! +XP earned.'}});draw()}
